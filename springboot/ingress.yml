# multi-app-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: multi-app-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: apps.example.com   # Replace with your domain
      http:
        paths:
          - path: /nodejs
            pathType: Prefix
            backend:
              service:
                name: my-nodejs-app-service
                port:
                  number: 3000
          - path: /springboot
            pathType: Prefix
            backend:
              service:
                name: springboot-service
                port:
                  number: 80
  # Optional TLS
  # tls:
  #   - hosts:
  #       - apps.example.com
  #     secretName: apps-tls-secret
